; Runs all five former microservices as sibling processes inside one
; container, so the whole app can be deployed as a single Render web
; service. Only `web` binds the externally-routed $PORT; everything else
; listens on 127.0.0.1 and is only reachable from inside the container.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:ai-service]
directory=/app/ai-service
command=/opt/py-ai/bin/python3.12 -m uvicorn app.main:app --host 127.0.0.1 --port 8000
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ats-service]
directory=/app/ats-service
command=/opt/py-ats/bin/python3.12 -m uvicorn app.main:app --host 127.0.0.1 --port 8200
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pii-service]
directory=/app/pii-service
command=/opt/py-pii/bin/python3.12 -m uvicorn app.main:app --host 127.0.0.1 --port 8100
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pdf-service]
directory=/app/pdf-service
command=node dist/server.js
; Render injects PORT for the whole container (for the `web` process to
; bind); override it here so pdf-service keeps using its own fixed port.
environment=PORT="4000"
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
directory=/app/web
command=/usr/local/bin/node /app/web/node_modules/next/dist/bin/next start -p %(ENV_PORT)s -H 0.0.0.0
autorestart=true
startretries=10
; Give the sibling FastAPI/Express processes a moment's head start so the
; first real request doesn't race their startup (parse/ats-score/export
; degrade gracefully if a sibling isn't up yet anyway, this just avoids it
; in the common case).
priority=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
